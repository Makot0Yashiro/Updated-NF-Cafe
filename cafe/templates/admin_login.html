{% extends "base.html" %}
{% block meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block title %}Staff sign in · New Found Cafe{% endblock %}
{% block content %}
<form method="post" class="card dark narrow">
  <p class="eyebrow" style="color:var(--line)"><i style="background:var(--line)"></i><b style="border-color:var(--line)"></b>Staff only</p>
  <h1 style="font-size:2.2rem">Admin login</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Email<input type="email" name="email" required autofocus></label>
  <label>Password<input type="password" name="password" required></label>
  <button class="btn full">Sign in</button>
</form>
{% endblock %}
