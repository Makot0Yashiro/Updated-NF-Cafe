{% extends "base.html" %}
{% block content %}
<form method="post" class="card narrow">
  <p class="eyebrow"><i></i><b></b>Account help</p>
  <h1 style="font-size:2.2rem">Forgot password</h1>
  <p>Enter your email and we'll send you a 6-digit code to reset your password.</p>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Email<input type="email" name="email" required autofocus></label>
  <button class="btn full">Send code</button>
  <p style="margin-top:1.2rem;font-size:.9rem"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
</form>
{% endblock %}
