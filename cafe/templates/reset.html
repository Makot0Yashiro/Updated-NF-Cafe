{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <p class="eyebrow"><i></i><b></b>Check your email</p>
  <h1 style="font-size:2.2rem">New password</h1>
  <p>If <b>{{ email }}</b> is registered, we sent a 6-digit code to it. It expires in 10 minutes.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Verification code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required autofocus style="letter-spacing:.5em;font-size:1.4rem;text-align:center"></label>
    <label>New password<input type="password" name="password" minlength="6" required autocomplete="new-password"></label>
    <label>Confirm new password<input type="password" name="confirm" minlength="6" required autocomplete="new-password"></label>
    <button class="btn full">Reset password</button>
  </form>
  <form method="post" action="{{ url_for('auth.reset_resend') }}" style="margin-top:1rem">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <small>Didn't get it?</small> <button class="btn small ghost" style="margin:0 0 0 .4rem">Send a new code</button>
    <a href="{{ url_for('auth.login') }}" style="margin-left:.8rem;font-size:.85rem">Back to login</a>
  </form>
</div>
{% endblock %}
